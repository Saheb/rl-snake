<svg width="680" viewBox="0 0 680 668" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif">
<title>SizeAgnosticQNet architecture</title>
<desc>3-channel board of any size -> size-agnostic conv trunk -> global avg+max pool collapsing the board to a fixed 256-vector (the only place board size enters) -> fixed policy head (value + advantage streams) -> dueling combine -> argmax action.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
  .t{font-size:14px;fill:#111827}.ts{font-size:12px}.th{font-size:14px;font-weight:500}
  .box{fill:#f9fafb;stroke:#6b7280;stroke-width:1.2}
  .amber{fill:#FEF3C7;stroke:#D97706;stroke-width:1.2}
  .amber-t{fill:#92400E}
  .blue{fill:#E6F1FB;stroke:#2563EB;stroke-width:1.2}
  .blue-t{fill:#0C447C}
  .arr{stroke:#6b7280;stroke-width:1.5;fill:none}
  .gray-t{fill:#374151}
</style>

<rect class="box" x="190" y="44" width="300" height="52" rx="8"/>
<text class="th t" x="340" y="68" text-anchor="middle">Input tensor</text>
<text class="ts gray-t" x="340" y="85" text-anchor="middle">3 &#215; H &#215; W &#183; body / head / food</text>
<line class="arr" x1="340" y1="96" x2="340" y2="140" marker-end="url(#arrow)"/>

<rect class="box" x="160" y="140" width="360" height="64" rx="8"/>
<text class="th t" x="340" y="164" text-anchor="middle">Conv trunk</text>
<text class="ts gray-t" x="340" y="181" text-anchor="middle">3&#8594;64&#8594;128, 3&#215;3 conv, ReLU</text>
<text class="ts gray-t" x="340" y="197" text-anchor="middle">output 128 &#215; H &#215; W &#8212; size-agnostic</text>
<line class="arr" x1="340" y1="204" x2="340" y2="248" marker-end="url(#arrow)"/>

<rect class="amber" x="160" y="248" width="360" height="64" rx="8"/>
<text class="th amber-t" x="340" y="272" text-anchor="middle">Global pooling &#8594; 256-vector</text>
<text class="ts amber-t" x="340" y="289" text-anchor="middle">avg-pool(128) &#8214; max-pool(128)</text>
<text class="ts amber-t" x="340" y="305" text-anchor="middle">the only place board size enters</text>
<line class="arr" x1="340" y1="312" x2="185" y2="366" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="312" x2="505" y2="366" marker-end="url(#arrow)"/>

<rect class="blue" x="60" y="368" width="230" height="66" rx="8"/>
<text class="th blue-t" x="175" y="391" text-anchor="middle">Value stream</text>
<text class="ts blue-t" x="175" y="408" text-anchor="middle">Linear &#8594; ReLU &#8594; Linear</text>
<text class="ts blue-t" x="175" y="424" text-anchor="middle">&#8594; V : 1 scalar</text>

<rect class="blue" x="390" y="368" width="230" height="66" rx="8"/>
<text class="th blue-t" x="505" y="391" text-anchor="middle">Advantage stream</text>
<text class="ts blue-t" x="505" y="408" text-anchor="middle">Linear &#8594; ReLU &#8594; Linear</text>
<text class="ts blue-t" x="505" y="424" text-anchor="middle">&#8594; A : 4 scores (probe taps)</text>

<line class="arr" x1="175" y1="434" x2="255" y2="478" marker-end="url(#arrow)"/>
<line class="arr" x1="505" y1="434" x2="425" y2="478" marker-end="url(#arrow)"/>

<rect class="blue" x="200" y="480" width="280" height="58" rx="8"/>
<text class="th blue-t" x="340" y="503" text-anchor="middle">Dueling combine</text>
<text class="ts blue-t" x="340" y="519" text-anchor="middle">Q = V + (A &#8722; mean A)</text>
<text class="ts blue-t" x="340" y="533" text-anchor="middle">greedy: argmax Q = argmax A</text>
<line class="arr" x1="340" y1="538" x2="340" y2="566" marker-end="url(#arrow)"/>

<rect class="box" x="250" y="566" width="180" height="44" rx="8"/>
<text class="th t" x="340" y="593" text-anchor="middle">argmax &#8594; action</text>

<rect class="amber" x="150" y="630" width="15" height="15" rx="3"/>
<text class="ts gray-t" x="172" y="642" text-anchor="start">where board size enters</text>
<rect class="blue" x="380" y="630" width="15" height="15" rx="3"/>
<text class="ts gray-t" x="402" y="642" text-anchor="start">fixed policy head (the reader)</text>
</svg>
